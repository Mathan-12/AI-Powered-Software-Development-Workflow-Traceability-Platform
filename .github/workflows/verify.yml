name: Build and backend smoke check

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install frontend
        run: npm install
      - name: Lint frontend
        run: npm run lint
      - name: Build frontend
        run: npm run build
      - name: Install backend
        working-directory: backend
        run: npm install
      - name: Verify backend modules
        working-directory: backend
        run: node --check app.js && node --check server.js && node --check controllers/authController.js && node --check middleware/authMiddleware.js
